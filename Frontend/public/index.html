<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview · Cloud Agent Monitoring</title>
<script>(function(){try{var t=localStorage.getItem('cam-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<!-- Web fonts are an enhancement: loaded without blocking render, and every
     stack in app.css falls back to system fonts if this network cannot reach them. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="app.css?v=20261110b">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="main" id="app"><p class="mut">Loading&hellip;</p></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js?v=20261110b"></script>
<script>
/* Overview. The page is ordered by what an operator needs during an incident:
   is anything wrong (hero), what and in which order (triage queue), what to do
   about the selected one (runbook), and only then the whole fleet. The triage
   queue is absent - not empty - when nothing is wrong, so its presence is itself
   the signal. */
const C = window.CAM, $ = C.$, esc = C.esc;
let AN = null, sel = null, filter = 'all';
const info = {};                 // item.key -> how long it has been over (CAM.breachInfo)

const href = i => (i.id ? 'instance.html?id=' + encodeURIComponent(i.id) : '#');
const joinAnd = a => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);

function heroHtml(an) {
  const c = an.counts, n = an.items.length;
  if (!an.scan) {
    return `<section class="hero" aria-label="Current state"><div class="hero-msg">
      <div class="hero-state"><i aria-hidden="true"></i><b>NO SCAN YET</b></div>
      <h1>Waiting for the first scan</h1>
      <p>Agent 1 has not reported yet. Use Scan now to run one.</p></div></section>`;
  }
  const at = C.utcClock(C.parseUtc(an.scan.scanned_at));
  const parts = [];
  if (c.stopped) parts.push(C.plural(c.stopped, 'instance') + ' stopped');
  if (c.breaches) parts.push(C.plural(c.breaches, 'threshold breach', 'threshold breaches'));
  if (c.down) parts.push(C.plural(c.down, 'service') + ' down');
  if (c.ctrBad) parts.push(C.plural(c.ctrBad, 'container') + ' unhealthy or restarting');
  const text = joinAnd(parts);
  const kpi = (label, val, sub, tone) => `<div class="kpi ${tone || ''}"><span class="eyebrow">${label}</span><b>${val}</b><small>${esc(sub)}</small></div>`;
  const kpis = kpi('Instances', c.instances, c.attention ? c.attention + (c.attention === 1 ? ' needs attention' : ' need attention') : 'all nominal')
    + kpi('Breaches', c.breaches, 'of ' + C.plural(c.metrics, 'metric'), c.breaches ? 'hot' : '')
    + kpi('Probes down', c.down, c.probes ? (c.probes - c.down) + ' of ' + c.probes + ' up' : 'no probes set', c.down ? 'hot' : '')
    + kpi('Containers', c.ctrBad || c.ctrs, c.ctrBad ? (c.ctrBad === 1 ? 'needs attention' : 'need attention') : (c.ctrs ? 'all healthy' : 'not collected'), c.ctrBad ? 'warn' : '');
  const strip = an.groups.map(g => `<div class="strip-g"><span class="eyebrow">${esc(g.name)}</span><div class="strip-cells">${
    g.insts.map(i => `<a class="cell ${i.tone}" href="${href(i)}" title="${esc(i.name + ': ' + i.tag.toLowerCase())}" aria-label="${esc(i.name + ': ' + i.tag.toLowerCase())}">${esc(C.roleAbbr(i.role))}</a>`).join('')
  }</div></div>`).join('');
  return `<section class="hero ${n ? 'hot' : 'calm'}" aria-label="Current state">
    <div class="hero-top">
      <div class="hero-msg">
        <div class="hero-state"><i aria-hidden="true"></i><b>${n ? 'ATTENTION REQUIRED' : 'ALL SYSTEMS NOMINAL'}</b><span>as of scan ${at} UTC</span></div>
        <h1>${n ? n + (n === 1 ? ' issue needs attention' : ' issues need attention') : 'Nothing needs you right now'}</h1>
        <p>${n ? esc(text.charAt(0).toUpperCase() + text.slice(1)) + '.' : 'Every instance, metric and probe is inside its limit. The triage queue appears here the moment something breaks.'}</p>
      </div>
      <div class="kpis">${kpis}</div>
    </div>
    <div class="strip" aria-label="Fleet at a glance">${strip}
      <div class="legend"><span><i class="hot" aria-hidden="true"></i>breach or down</span><span><i class="warn" aria-hidden="true"></i>degraded</span><span><i aria-hidden="true"></i>nominal</span></div>
    </div>
  </section>`;
}

function sideHtml(it) {
  const x = info[it.key];
  return (x ? C.sparkSvg(x) + (x.dur ? `<span class="dur">${esc(x.dur)}</span><span class="since">${esc(x.since)}</span>` : '') : '')
    + `<span class="hint">${it.key === sel ? 'Runbook open' : 'Show runbook'}</span>`;
}

function rowHtml(it) {
  return `<button type="button" class="trow ${it.tone}" data-item="${esc(it.key)}" aria-pressed="${it.key === sel}">
    <span class="rank">${it.rank}</span>
    <span class="body">
      <span class="line1"><span class="tag ${it.tone}">${it.tag}</span><b>${esc(it.inst)}</b><span class="small mut">${esc(it.group)}</span></span>
      <span class="what">${esc(it.what)}</span>
      <span class="why">${esc(it.why)}</span>
    </span>
    <span class="side" data-side="${esc(it.key)}">${sideHtml(it)}</span>
  </button>`;
}

function alertHtml(an) {
  const a = an.alert, auto = 'Auto-alert is ' + (an.config.auto_alert_on_breach ? 'on' : 'off') + ' for breaches and outages.';
  const body = a
    ? `<div class="cmd"><code>${esc(a.subject || '(no subject)')}</code></div>
       <p class="small mut">${a.sent ? 'Emailed' : esc(a.reason || 'Not sent')} ${esc(C.utcStamp(a.sent_at))} UTC${a.trigger ? ' · ' + esc(a.trigger) : ''}. ${auto}</p>`
    : `<p class="small mut">No alert has been sent yet. ${auto}</p>`;
  return `<section class="panel" aria-label="Last alert">
    <div class="panel-head"><h2>Last alert</h2></div>${body}
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px">
      <button type="button" class="btn" id="sendBtn">Send alert email now</button>
      <a href="activity.html" style="display:inline-flex;align-items:center;min-height:44px;font-weight:500">Open in Activity</a>
    </div></section>`;
}

function triageHtml(an) {
  if (!an.items.length) return '';
  const cur = an.items.find(i => i.key === sel);
  return `<div class="split">
    <div class="col-a">
      <section class="panel" aria-label="Triage queue">
        <div class="panel-head"><h2>Triage queue</h2><span class="small mut">Ranked by what explains the most. Start at 01.</span><span class="right mono tiny mut">${an.items.length} open</span></div>
        ${an.items.map(rowHtml).join('')}
      </section>
      ${alertHtml(an)}
    </div>
    <div class="col-b"><aside class="panel raised" id="runbookBox" aria-label="Runbook for the selected issue">${cur ? C.runbook(cur, an) : ''}</aside></div>
  </div>`;
}

// ---- fleet map --------------------------------------------------------------
// Lanes follow the request path by role: frontend, then backend, then database.
// The link INTO a tier carries that tier's own service probe, which is what the
// monitor measures - it is not latency between the two boxes.
const TIERS = [['frontend'], ['backend'], ['db', 'rds']];
const USERS = '<span class="entry"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>Users</span>';

function hopHtml(nodes) {
  const ps = nodes.map(i => i.svcs.find(s => s.name !== 'SSH')).filter(Boolean);
  if (!ps.length) return '<span class="hop none"><b>no probe</b><i aria-hidden="true"></i><span>&nbsp;</span></span>';
  const uniq = a => a.filter((v, k) => a.indexOf(v) === k);
  const full = uniq(ps.map(s => s.name + C.portOf(s)));
  const label = full.length === 1 ? full[0] : uniq(ps.map(s => s.name)).join(' / ');
  const down = ps.find(s => s.up === false);
  const val = down ? 'DOWN' + C.shortErr(down)
    : ps.map(s => (s.latency_ms != null ? s.latency_ms + ' ms' : (s.up === true ? 'up' : 'unknown'))).join(' / ');
  return `<span class="hop${down ? ' down' : ''}"><b>${esc(label)}</b><i aria-hidden="true"></i><span>${esc(val)}</span></span>`;
}

function nodeRead(i) {
  if (i.stopped) return ['Instance ' + i.stopped, true];
  if (i.breaches.length) { const m = i.breaches[0]; return [C.shortLabel(m.label) + ' ' + C.num(m.value) + (m.unit || '') + ' · limit ' + m.threshold, true]; }
  if (i.down.length) return [i.down[0].name + C.portOf(i.down[0]) + ' DOWN' + C.shortErr(i.down[0]), true];
  if (i.ctrBad) { const c = ((i.det && i.det.containers) || []).find(C.ctrBad); return [c ? c.name + ' ' + c.health : 'container unhealthy', true]; }
  const m = C.closest(i);
  return [m ? C.shortLabel(m.label) + ' ' + C.num(m.value) + '% · limit ' + m.threshold : 'no data', false];
}

function nodeHtml(i) {
  const r = nodeRead(i);
  return `<a class="node ${i.tone}" href="${href(i)}">${C.nodeRing(i)}<span class="t"><b>${esc(i.name)}</b><span class="${r[1] ? 'bad' : ''}">${esc(r[0])}</span><em>${i.tag}</em></span></a>`;
}

function laneHtml(g) {
  const stack = list => `<div class="stack">${list.map(nodeHtml).join('')}</div>`;
  const tiers = TIERS.map(roles => g.insts.filter(i => roles.includes(i.role)));
  const rest = g.insts.filter(i => !TIERS.some(roles => roles.includes(i.role)));
  let cells = '';
  if (tiers.filter(t => t.length).length >= 2) {
    let prev = false;
    tiers.forEach((t, k) => {
      if (!t.length) return;
      if (prev) cells += hopHtml(t); else if (k === 0) cells += USERS + hopHtml(t);
      cells += stack(t);
      prev = true;
    });
    rest.forEach(i => { cells += '<span class="gapcell" aria-hidden="true"></span>' + stack([i]); });
  } else {
    // No path to draw (one tier, or roles that do not chain): just the instances.
    cells = g.insts.map((i, k) => (k ? '<span class="gapcell" aria-hidden="true"></span>' : '') + stack([i])).join('');
  }
  return `<div class="lane ${g.tone}"><div class="lane-name"><b>${esc(g.name)}</b><span>${esc(g.note)}</span></div>${cells}</div>`;
}

function mapHtml(an) {
  if (!an.groups.length) return '';
  return `<section class="panel" aria-label="Fleet map">
    <div class="panel-head"><h2>Fleet map</h2><span class="small mut">Each environment along its request path. A ring shows the metric closest to its limit, a link is the service probe on that hop.</span></div>
    ${an.groups.map(laneHtml).join('')}
  </section>`;
}

// ---- fleet cards ------------------------------------------------------------
function ctrsHtml(i) {
  const det = i.det;
  if (!det) return '';
  const list = det.containers || [];
  // A collection problem is worth showing even when some rows arrived - e.g.
  // `docker ps` succeeded but `docker stats` timed out, so usage is missing.
  const err = det.containers_error ? `<div class="note-line">${esc(det.containers_error)}</div>` : '';
  if (!list.length) return err ? `<div class="ctrs"><div class="ctrs-head">Docker services</div>${err}</div>` : '';
  const bad = det.containers_attention || 0;
  const heavy = i.breaches.length ? C.heaviest(list, i.breaches[0].label) : null;
  const n = C.plural(list.length, 'container');
  const summary = bad ? `${n} · ${bad} need${bad === 1 ? 's' : ''} attention` : (heavy ? `${n} · ${heavy.name} is the heaviest` : (i.breaches.some(m => m.label === 'CPU' || m.label === 'Memory') ? `${n} · none stands out` : `${n} · all healthy`));
  const sorted = list.slice().sort((a, b) => (C.ctrBad(b) ? 1 : 0) - (C.ctrBad(a) ? 1 : 0) || (b === heavy) - (a === heavy) || (b.cpu_pct || 0) - (a.cpu_pct || 0));
  const rows = sorted.slice(0, 4).map(c => `<div class="ctr${C.ctrBad(c) ? ' bad' : ''}${c === heavy ? ' heavy' : ''}" title="${esc([c.image, c.status, c.mem_usage, c.ports].filter(Boolean).join(' · '))}">
      <span>${esc(c.name)}</span><span>${C.pct(c.cpu_pct)} cpu</span><span>${C.pct(c.mem_pct)} mem</span><span class="h">${esc(c.health || 'unknown')}</span></div>`).join('');
  return `<div class="ctrs">
    <div class="ctrs-head${bad ? ' warn' : ''}"><span>${esc(summary)}</span>${C.sampledAt(det)}</div>
    <div class="blocks" aria-hidden="true">${sorted.map(c => `<i class="${C.ctrBad(c) ? 'bad' : (c === heavy ? 'heavy' : '')}"></i>`).join('')}</div>
    ${rows}${err}
    ${list.length > 4 ? `<a class="tiny" href="${href(i)}">All ${list.length} containers</a>` : ''}
  </div>`;
}

function cardHtml(i) {
  const det = i.det || {};
  const spec = C.specBits(det.spec);
  const notes = [];
  if (!i.svcs.length) notes.push(det.host ? 'No service probes are defined for this role.' : 'Probes off: no host set for this instance.');
  if (i.role === 'rds') notes.push('Managed database. Diagnosed over SQL, there is no shell.');
  return `<article class="card ${i.tone}">
    <div class="card-head">${C.chip(i.role, i.tone)}
      <div class="card-name"><a href="${href(i)}">${esc(i.name)}</a><span>${esc(i.id)}${i.role ? ' · ' + esc(i.role) : ''}</span></div>
      <span class="tag ${i.tone}">${i.tag}</span>
    </div>
    ${spec.length || i.stopped ? `<div class="spec">${spec.join(' · ')}${i.stopped ? (spec.length ? ' · ' : '') + '<span class="bad">' + esc(i.stopped) + '</span>' : ''}</div>` : ''}
    <div class="rings">${i.metrics.map(C.ring).join('')}</div>
    ${i.svcs.length ? `<div class="probes">${i.svcs.map(C.probe).join('')}</div>` : ''}
    ${notes.map(t => `<div class="note-line">${esc(t)}</div>`).join('')}
    ${ctrsHtml(i)}
  </article>`;
}

function fleetHtml(an) {
  const c = an.counts;
  const btn = (key, label) => `<button type="button" data-filter="${esc(key)}" aria-pressed="${filter === key}">${esc(label)}</button>`;
  const groups = an.groups.filter(g => filter === 'all' || filter === 'issues' || g.name === filter)
    .map(g => ({ g: g, insts: filter === 'issues' ? g.insts.filter(i => i.problem) : g.insts }))
    .filter(x => x.insts.length);
  return `<div class="fleet-head">
      <h2>Fleet</h2>
      <div class="seg" role="group" aria-label="Filter instances">
        ${btn('all', 'All ' + c.instances)}${c.attention ? btn('issues', 'Issues only ' + c.attention) : ''}${an.groups.map(g => btn(g.name, g.name)).join('')}
      </div>
      <span class="right">Problems sort first in each group. The tick on each ring is the alert limit.</span>
    </div>
    ${groups.map(x => `<div class="group">
      <div class="group-head"><h3>${esc(x.g.name)}</h3><span class="small mut">${C.plural(x.g.insts.length, 'instance')}</span><span class="note ${x.g.tone}">${esc(x.g.note)}</span></div>
      <div class="cards">${x.insts.map(cardHtml).join('')}</div>
    </div>`).join('')}`;
}

// ---- lifecycle --------------------------------------------------------------
function render(an) {
  AN = an;
  if (!an.items.some(i => i.key === sel)) sel = an.items.length ? an.items[0].key : null;
  if (filter === 'issues' ? !an.counts.attention : (filter !== 'all' && !an.groups.some(g => g.name === filter))) filter = 'all';
  $('#app').innerHTML = heroHtml(an) + triageHtml(an) + (an.scan
    ? mapHtml(an) + `<section id="fleetBox" aria-label="Fleet" style="display:flex;flex-direction:column;gap:28px">${fleetHtml(an)}</section>` : '')
    + `<footer class="foot">Agent 1 scans CloudMonitor and service health every ${esc(an.config.interval_minutes || '-')} minutes. Agent 2 sends DirectMail alerts. Times are UTC.</footer>`;
  // "Over since when" needs the history series; fill it in once it arrives.
  an.items.filter(it => it.metric && it.instId).forEach(it => {
    C.breachInfo(it.instId, it.kind, an.scan.scanned_at).then(x => { if (x) { info[it.key] = x; paintSides(); } });
  });
}

function paintSides() {
  if (!AN) return;
  document.querySelectorAll('[data-side]').forEach(el => {
    const it = AN.items.find(i => i.key === el.dataset.side);
    if (it) el.innerHTML = sideHtml(it);
  });
}

document.addEventListener('click', ev => {
  const row = ev.target.closest('.trow[data-item]');
  if (row && AN) {
    sel = row.dataset.item;
    document.querySelectorAll('.trow[data-item]').forEach(r => r.setAttribute('aria-pressed', String(r.dataset.item === sel)));
    paintSides();
    const cur = AN.items.find(i => i.key === sel);
    if (cur) $('#runbookBox').innerHTML = C.runbook(cur, AN);
    return;
  }
  const f = ev.target.closest('[data-filter]');
  if (f && AN) { filter = f.dataset.filter; $('#fleetBox').innerHTML = fleetHtml(AN); return; }
  const s = ev.target.closest('#sendBtn');
  if (s) C.sendAlert(s);
});

C.start('overview', render);
</script>
</body>
</html>
