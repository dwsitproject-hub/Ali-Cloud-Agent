<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Instance · Cloud Agent Monitoring</title>
<style>
  :root { --bg:#0f1419; --card:#1a2230; --line:#2a3546; --txt:#e6edf3; --mut:#8b98a8;
          --ok:#27ae60; --bad:#e74c3c; --warn:#e0a800; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  header { padding:20px 28px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  h1 { font-size:18px; margin:0; }
  .sub { color:var(--mut); font-size:13px; margin-top:4px; }
  a { color:var(--accent); text-decoration:none; }
  .wrap { padding:24px 28px; max-width:1000px; margin:auto; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:20px; }
  .panel h2 { font-size:15px; margin:0 0 14px; }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; align-items:end; }
  label { display:block; font-size:12px; color:var(--mut); margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px; }
  input, select { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt);
                  border-radius:8px; padding:9px 11px; font-size:14px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .actions { grid-column:1/-1; display:flex; gap:10px; align-items:center; }
  button { background:var(--accent); color:#fff; border:0; padding:10px 16px; border-radius:8px;
           font-size:14px; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  button.danger { background:transparent; border:1px solid var(--bad); color:var(--bad); padding:5px 10px; font-size:12px; }
  button.toggle { background:transparent; border:1px solid var(--line); color:var(--txt); padding:5px 10px; font-size:12px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; font-size:11px; text-transform:uppercase; }
  td.mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mut); }
  .tag { font-size:11px; padding:2px 9px; border-radius:999px; font-weight:700; }
  .tag.on { background:rgba(39,174,96,.15); color:var(--ok); }
  .tag.off { background:rgba(139,152,168,.15); color:var(--mut); }
  .hint { font-size:12px; color:var(--mut); margin-top:4px; }
  #msg { font-size:13px; }
  #msg.ok { color:var(--ok); } #msg.err { color:var(--bad); }
  .muted { color:var(--mut); font-size:13px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Register Instance</h1>
    <div class="sub">Add an ECS instance to monitor &middot; picked up on the next scan</div>
  </div>
  <div><a href="index.html">&larr; Back to dashboard</a></div>
</header>

<div class="wrap">
  <div class="panel">
    <h2>New instance</h2>
    <form id="addForm" autocomplete="off">
      <div>
        <label for="f-id">ECS Instance ID</label>
        <input id="f-id" name="id" placeholder="i-xxxxxxxxxxxxxxxxxxxx" required>
      </div>
      <div>
        <label for="f-name">Display name</label>
        <input id="f-name" name="name" placeholder="Backend Production" required>
      </div>
      <div>
        <label for="f-role">Role</label>
        <select id="f-role" name="role" required></select>
        <div class="hint">Role selects the default TCP/HTTP service checks.</div>
      </div>
      <div>
        <label for="f-host">Host (IP / DNS)</label>
        <input id="f-host" name="host" placeholder="leave blank to skip probes">
      </div>
      <div>
        <label for="f-group">Group</label>
        <select id="f-group" name="group_id"></select>
      </div>
      <div id="newGroupWrap" style="display:none">
        <label for="f-newgroup">New group name</label>
        <input id="f-newgroup" name="group_name" placeholder="e.g. Production">
      </div>
      <div class="actions">
        <button type="submit" id="addBtn">Add instance</button>
        <span id="msg"></span>
      </div>
    </form>
  </div>

  <div class="panel">
    <h2>Monitored instances (<span id="count">0</span>)</h2>
    <table>
      <thead><tr><th>Name</th><th>Instance ID</th><th>Role</th><th>Host</th><th>Group</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const API = (window.APP_CONFIG && window.APP_CONFIG.apiBase) || '';
let CSRF = null;

function api(path, opts){ opts = opts || {}; opts.credentials = 'include'; return fetch(API + path, opts); }
async function loadCsrf(){
  try{ const r = await api('/api/csrf'); if(r.ok){ CSRF = (await r.json()).csrf_token; } }catch(e){}
}
function headers(){
  const h = {'Content-Type':'application/json'};
  if(CSRF) h['X-CSRFToken'] = CSRF;
  return h;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function msg(text, ok){ const m=$('#msg'); m.textContent=text; m.className=ok?'ok':'err';
  if(text) setTimeout(()=>{ if(m.textContent===text){ m.textContent=''; } }, 4000); }
function authGuard(r){ if(r.status===401){ window.location='login.html'; return true; } return false; }

async function loadMeta(){
  const r = await api('/api/instances/meta'); if(authGuard(r)) return;
  const meta = await r.json();
  $('#f-role').innerHTML = meta.roles.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  $('#f-group').innerHTML =
    meta.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')
    + '<option value="__new__">+ New group…</option>';
}

async function load(){
  const r = await api('/api/instances'); if(authGuard(r)) return;
  const list = await r.json();
  $('#count').textContent = list.length;
  const b = $('#rows');
  if(!list.length){ b.innerHTML='<tr><td colspan="7" class="muted">No instances yet.</td></tr>'; return; }
  b.innerHTML = list.map(i=>`<tr>
    <td>${esc(i.name)}</td>
    <td class="mono">${esc(i.id)}</td>
    <td>${esc(i.role)}</td>
    <td class="mono">${esc(i.host)||'<span class="muted">—</span>'}</td>
    <td>${esc(i.group)}</td>
    <td><span class="tag ${i.enabled?'on':'off'}">${i.enabled?'enabled':'disabled'}</span></td>
    <td style="white-space:nowrap">
      <button class="toggle" onclick="toggle('${esc(i.id)}', ${!i.enabled})">${i.enabled?'Disable':'Enable'}</button>
      <button class="danger" onclick="remove('${esc(i.id)}','${esc(i.name)}')">Delete</button>
    </td></tr>`).join('');
}

$('#f-group').addEventListener('change', e=>{
  $('#newGroupWrap').style.display = e.target.value==='__new__' ? 'block' : 'none';
});

$('#addForm').addEventListener('submit', async e=>{
  e.preventDefault();
  $('#addBtn').disabled = true;
  const body = {
    id: $('#f-id').value.trim(),
    name: $('#f-name').value.trim(),
    role: $('#f-role').value,
    host: $('#f-host').value.trim(),
  };
  if($('#f-group').value==='__new__') body.group_name = $('#f-newgroup').value.trim();
  else body.group_id = $('#f-group').value;
  try{
    const r = await api('/api/instances', {method:'POST', headers:headers(), body:JSON.stringify(body)});
    if(authGuard(r)) return;
    const data = await r.json();
    if(r.ok){ msg('Added '+data.name, true); $('#addForm').reset(); $('#newGroupWrap').style.display='none'; await loadMeta(); await load(); }
    else msg(data.error || 'Failed to add', false);
  }catch(err){ msg('Network error', false); }
  finally{ $('#addBtn').disabled=false; }
});

async function toggle(id, enabled){
  const r = await api('/api/instances/'+encodeURIComponent(id), {method:'PATCH', headers:headers(), body:JSON.stringify({enabled})});
  if(authGuard(r)) return;
  await load();
}
async function remove(id, name){
  if(!confirm('Delete '+name+' ('+id+')? This removes it from monitoring.')) return;
  const r = await api('/api/instances/'+encodeURIComponent(id), {method:'DELETE', headers:headers()});
  if(authGuard(r)) return;
  await load();
}

(async ()=>{ await loadCsrf(); await loadMeta(); await load(); })();
</script>
</body>
</html>
