<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Cloud Agent Monitoring</title>
<style>
  :root { --bg:#0f1419; --card:#1a2230; --line:#2a3546; --txt:#e6edf3; --mut:#8b98a8; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); min-height:100vh;
         display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:34px 32px; width:360px; max-width:92vw; text-align:center; }
  h1 { font-size:19px; margin:0 0 6px; }
  p { color:var(--mut); font-size:13px; line-height:1.5; margin:0 0 22px; }
  a.btn, button { display:block; width:100%; background:var(--accent); color:#fff; border:0;
        padding:12px 16px; border-radius:9px; font-size:14px; font-weight:600;
        cursor:pointer; text-decoration:none; margin-top:10px; }
  .ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  .divider { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin:18px 0 4px; }
  .logo { font-size:13px; color:var(--mut); margin-bottom:18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">☁ Cloud Agent Monitoring</div>
    <h1>Sign in required</h1>
    <p>This dashboard is protected. Access it through the Downstream Hub, which
       signs you in automatically via SSO.</p>

    {% if dev_login %}
      <div class="divider">Local development</div>
      <a class="btn ghost" href="{{ url_for('auth.dev_login') }}">Continue with dev login</a>
    {% endif %}
  </div>
</body>
</html>
