# Full local stack for Cloud Agent Monitoring (app + PostgreSQL).
#
#   docker compose up --build        # build + run app and db together
#   # then open http://localhost:5000  (click "Continue with dev login")
#
# Or run only Postgres and the app on the host:
#   docker compose up -d db          # Postgres only, exposed on localhost:5440
#   (then: flask db upgrade && flask seed && python Backend/app.py)
#
# Port 5440 avoids clashing with any local Postgres on 5432. Inside the compose
# network the app reaches Postgres at db:5432.
#
services:
  app:
    build: .
    container_name: cloud-agent-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Test config: synthetic data, no Alibaba creds, dev login on.
      MOCK_MODE: "true"
      DEV_LOGIN_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg2://cloudagent:cloudagent@db:5432/cloudagent
      SECRET_KEY: dev-insecure-change-me
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: Lax
      ALERT_RECIPIENTS: dev@localhost
    # Apply migrations + seed, then serve.
    command: >
      sh -c "python -m flask db upgrade &&
             python -m flask seed &&
             gunicorn --workers 1 --chdir Backend --bind 0.0.0.0:5000 wsgi:app"
    ports:
      - "5000:5000"

  db:
    image: postgres:16-alpine
    container_name: cloud-agent-db
    environment:
      POSTGRES_USER: cloudagent
      POSTGRES_PASSWORD: cloudagent
      POSTGRES_DB: cloudagent
    ports:
      - "5440:5432"
    volumes:
      - cloud_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudagent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cloud_agent_pgdata:
